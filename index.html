<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#14112a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="黃金挖礦工">
<title>⛏️ 黃金挖礦工 Gold Miner</title>
<link rel="icon" type="image/svg+xml" href="gold-miner-app-logo.svg">
<link rel="apple-touch-icon" href="gold-miner-app-logo.svg">
<style>
:root{--sat:env(safe-area-inset-top,0px);--sab:env(safe-area-inset-bottom,0px);--sal:env(safe-area-inset-left,0px);--sar:env(safe-area-inset-right,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
html,body{height:100%;margin:0;overflow:hidden;overscroll-behavior:none;background:#0f0d1c}
body{color:#fff;font-family:"Microsoft JhengHei","PingFang TC",sans-serif;touch-action:none;background:radial-gradient(circle at top,#2a2550,#0f0d1c 70%)}
#app{position:relative;height:100vh;height:100dvh;display:flex;flex-direction:column;padding:var(--sat) var(--sar) 0 var(--sal);max-width:760px;margin:0 auto}
#hud{display:flex;align-items:center;gap:5px;padding:6px 8px 4px;flex-wrap:wrap}
.pill{background:rgba(42,38,64,.9);padding:4px 8px;border-radius:10px;font-size:12.5px;white-space:nowrap;border:1px solid #3b3566}
#tombPill{background:rgba(70,40,90,.92);border-color:#8a5cc0}
#menuBtn{margin-left:auto;width:42px;height:34px;border:0;border-radius:10px;background:#ffb300;color:#222;font-size:19px;font-weight:bold}
#stage{flex:1;min-height:0;position:relative;display:flex;align-items:center;justify-content:center;padding:4px}
canvas{border-radius:12px;border:2px solid #3b3566;background:#6ec6ff;touch-action:none;box-shadow:0 6px 24px rgba(0,0,0,.45)}
#msg{position:absolute;top:10px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,.75);padding:6px 14px;border-radius:20px;font-size:13.5px;opacity:0;transition:.25s;pointer-events:none;white-space:nowrap;max-width:94%;overflow:hidden;text-overflow:ellipsis;z-index:3}
#ctrl{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:8px 12px calc(10px + var(--sab));background:linear-gradient(to top,rgba(0,0,0,.35),transparent)}
#pad{position:relative;width:148px;height:148px;border-radius:50%;flex:none;touch-action:none;background:radial-gradient(circle,rgba(70,62,120,.95) 0 28%,rgba(46,41,84,.9) 29% 100%);border:2px solid #4a4380}
#pad i{position:absolute;font-style:normal;font-size:22px;color:#cfc9f0}
#pad .u{top:8px;left:50%;transform:translateX(-50%)}#pad .d{bottom:8px;left:50%;transform:translateX(-50%)}
#pad .l{left:12px;top:50%;transform:translateY(-50%)}#pad .r{right:12px;top:50%;transform:translateY(-50%)}
#pad .k{position:absolute;left:50%;top:50%;width:46px;height:46px;margin:-23px 0 0 -23px;border-radius:50%;background:#7c4dff;box-shadow:0 2px 8px rgba(0,0,0,.5);transition:transform .06s}
#pad[data-dir=up] .k{transform:translateY(-26px)}#pad[data-dir=down] .k{transform:translateY(26px)}
#pad[data-dir=left] .k{transform:translateX(-26px)}#pad[data-dir=right] .k{transform:translateX(26px)}
#acts{display:grid;grid-template-columns:repeat(3,58px);gap:6px;flex:none}
.ab{height:58px;border:0;border-radius:15px;background:#3a3560;color:#fff;font-family:inherit;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:10.5px;line-height:1.25;touch-action:none;border-bottom:3px solid #231f45}
.ab .i{font-size:21px;line-height:1}.ab:active{transform:scale(.93);background:#5a4fa5}
.ab.cyan{background:#0a7f8c}.ab.green{background:#2a8a53}.ab.red{background:#c53030}.ab.orange{background:#c76b00}.ab.boom{background:#d84315}
@media (orientation:landscape) and (max-height:560px){
#app{max-width:none}
#hud{position:absolute;top:var(--sat);left:50%;transform:translateX(-50%);z-index:4;padding:4px;flex-wrap:nowrap}
#menuBtn{margin-left:6px}
#ctrl{position:absolute;left:0;right:0;bottom:0;z-index:4;padding:0 calc(14px + var(--sar)) calc(8px + var(--sab)) calc(14px + var(--sal));pointer-events:none;align-items:flex-end;background:none}
#ctrl>*{pointer-events:auto;opacity:.88}
#pad{width:120px;height:120px}#pad .k{width:38px;height:38px;margin:-19px 0 0 -19px}
#acts{grid-template-columns:repeat(3,46px);gap:5px}.ab{height:46px;font-size:9px;border-radius:12px}.ab .i{font-size:16px}
#stage{padding:0}}
@media (max-width:350px){#acts{grid-template-columns:repeat(3,50px)}.ab{height:50px}#pad{width:126px;height:126px}}
.btn{background:#7c4dff;color:#fff;border:0;border-radius:12px;padding:10px 14px;font-size:15px;cursor:pointer;font-family:inherit;min-height:42px}
.btn:active{transform:scale(.96)}.btn.gold{background:#ffb300;color:#222;font-weight:bold}.btn.red{background:#e53935}.btn.green{background:#2e9e5b}.btn:disabled{opacity:.4}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.72);display:none;align-items:flex-end;justify-content:center;z-index:30}
.modal.center{align-items:center}
.box{background:#231f38;width:100%;max-width:560px;max-height:88vh;max-height:88dvh;display:flex;flex-direction:column;border-radius:22px 22px 0 0;border:2px solid #3f3870;border-bottom:0}
.modal.center .box{border-radius:22px;border-bottom:2px solid #3f3870;width:92%;padding:18px}
.tabs{display:flex;gap:6px;overflow-x:auto;padding:12px 12px 8px;flex:none;scrollbar-width:none}.tabs::-webkit-scrollbar{display:none}
.tabs button{flex:none;padding:8px 12px;border:0;border-radius:12px;background:#3a3560;color:#fff;font-size:13.5px;font-family:inherit;white-space:nowrap}
.tabs button.on{background:#ffb300;color:#222;font-weight:bold}
#content{flex:1;overflow-y:auto;padding:4px 14px 8px;touch-action:pan-y;-webkit-overflow-scrolling:touch}
.foot{padding:8px 14px calc(12px + var(--sab));flex:none}
.item{display:flex;justify-content:space-between;align-items:center;background:#2f2a4d;padding:10px 11px;border-radius:12px;margin:7px 0;font-size:14px;gap:10px;line-height:1.45}
.item small{color:#b9b3d9}.item.done{opacity:.55}.item .btn{flex:none;min-width:74px}
.bar{height:8px;background:#1b1830;border-radius:6px;overflow:hidden;margin-top:5px}.bar i{display:block;height:100%;background:#ffd54a}
h2{margin:0 0 8px;color:#ffd54a;font-size:19px}
input[type=text]{background:#171428;border:1px solid #4a4380;color:#fff;padding:10px;border-radius:10px;width:100%;font-size:16px;font-family:inherit;-webkit-user-select:text;user-select:text}
table{width:100%;border-collapse:collapse;font-size:14px}td,th{padding:7px;text-align:center;border-bottom:1px solid #3a3560}
.roomwrap{border:3px solid #5d4037;border-radius:12px;overflow:hidden;margin:8px auto;max-width:420px}
.rwall{height:30px;text-align:center;font-size:19px;line-height:30px;letter-spacing:14px;color:rgba(0,0,0,.55)}
.room{display:grid}
.cell{aspect-ratio:1;border:1px solid rgba(0,0,0,.18);padding:0;font-size:clamp(16px,5.5vw,26px);line-height:1;min-width:0;color:#000}
.cell:active{filter:brightness(1.25)}
.pal{display:flex;gap:6px;overflow-x:auto;padding:4px 0 8px;scrollbar-width:none}.pal::-webkit-scrollbar{display:none}
.pi{flex:none;min-width:68px;border:2px solid #3f3870;background:#2f2a4d;color:#fff;border-radius:10px;padding:6px 4px;font-size:11px;text-align:center;line-height:1.35;font-family:inherit}
.pi.on{border-color:#ffd54a;background:#4a3f7a}.pi.off{opacity:.45}.pi .e{font-size:22px;display:block}
.sw{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0}
.sw button{border:2px solid #3f3870;border-radius:10px;padding:6px 9px;font-size:12px;color:#222;font-family:inherit}
.sw button.on{border-color:#ffd54a;box-shadow:0 0 0 2px #ffd54a55}
#home{position:fixed;inset:0;z-index:40;background:radial-gradient(circle at 50% 28%,#3a2f78,#0d0b18 75%);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:11px;text-align:center;padding:calc(20px + var(--sat)) 20px calc(20px + var(--sab));overflow:auto;touch-action:pan-y}
#home img{width:min(34vw,140px);height:min(34vw,140px);border-radius:28px;box-shadow:0 10px 40px rgba(255,200,0,.35)}
#home h2{font-size:30px;margin:0}#home p{margin:0;color:#cfc9f0;max-width:340px;font-size:14px;line-height:1.65}
#home .btn{width:min(78vw,260px);font-size:18px;padding:13px}
@media (orientation:landscape) and (max-height:480px){#home img{display:none}#home h2{font-size:24px}#home{gap:7px}}
</style>
</head>
<body>

<div id="home">
  <img src="gold-miner-app-logo.svg" alt="" onerror="this.style.display='none'">
  <h2>⛏️ 黃金挖礦工</h2>
  <p>地底沒有盡頭!越挖越深、越深越值錢,還能蓋房子、擺傢俱,打造你的礦工之家。</p>
  <button class="btn gold" id="startBtn">▶ 開始遊戲</button>
  <button class="btn" id="homeShop">🛒 商店 / 我的家 / 任務</button>
  <button class="btn" id="fsBtn" style="font-size:15px;padding:10px">⛶ 全螢幕</button>
  <p id="homeInfo"></p>
</div>

<div id="app">
  <div id="hud">
    <span class="pill" id="hp">❤️❤️❤️</span>
    <span class="pill">💰 <b id="gold">0</b></span>
    <span class="pill">💎 <b id="gems">0</b></span>
    <span class="pill">🎒 <b id="cargo">0</b>/<b id="cap">20</b></span>
    <span class="pill">📏 <b id="depth">0</b>m</span>
    <span class="pill" id="tombPill" style="display:none"></span>
    <button id="menuBtn" aria-label="選單">☰</button>
  </div>
  <div id="stage"><canvas id="c" width="600" height="480"></canvas><div id="msg"></div></div>
  <div id="ctrl">
    <div id="pad" data-dir=""><i class="u">▲</i><i class="d">▼</i><i class="l">◀</i><i class="r">▶</i><div class="k"></div></div>
    <div id="acts">
      <button class="ab" id="tntBtn"><span class="i">💣</span><span>TNT <b id="tnt">0</b></span></button>
      <button class="ab orange" id="c4Btn"><span class="i">🧨</span><span>C4 <b id="c4n">0</b></span></button>
      <button class="ab boom" id="detBtn"><span class="i">💥</span><span>引爆 <b id="detn">自動</b></span></button>
      <button class="ab" id="ladBtn"><span class="i">🪜</span><span>梯子 <b id="lad">0</b></span></button>
      <button class="ab cyan" id="scanBtn"><span class="i">📡</span><span>掃描 <b id="scn">-</b></span></button>
      <button class="ab cyan" id="botBtn"><span class="i">🤖</span><span>機器 <b id="botn">0/0</b></span></button>
      <button class="ab green" id="cpBtn"><span class="i">⛺</span><span>存檔點</span></button>
      <button class="ab red" id="upBtn"><span class="i">⬆️</span><span>回地面</span></button>
      <span></span>
    </div>
  </div>
</div>

<div class="modal" id="panel"><div class="box">
  <div class="tabs" id="tabs"></div><div id="content"></div>
  <div class="foot"><button class="btn" style="width:100%" onclick="closePanel()">關閉</button></div>
</div></div>

<div class="modal center" id="death"><div class="box" style="text-align:center">
  <h2>💀 你倒下了</h2>
  <p id="deathText" style="color:#cfc9f0;font-size:14px;line-height:1.6"></p>
  <button class="btn gold" style="width:100%;margin:6px 0" id="reviveBtn">💎 3 寶石原地復活</button>
  <button class="btn" style="width:100%" id="respBtn">⛺ 回到存檔點重來</button>
</div></div>

<script>
const COLS=15,T=40,SURF=3,CPGAP=50,HOUSE_X=11,DOOR_X=12;
let ROWS=0,VH=12;
const $=id=>document.getElementById(id);
const cv=$('c'),ctx=cv.getContext('2d');

const TY={EMPTY:0,DIRT:1,STONE:2,HARD:3,COAL:4,GOLD:5,GEM:6,BOULDER:7,DIAM:8,LADDER:9,BARREL:10,CHEST:11,BEDROCK:12};
const INFO={
 1:{hard:1,val:0,col:'#8b5a2b'},2:{hard:2.5,val:0,col:'#7d7d85'},3:{hard:5,val:0,col:'#4a4a55'},
 4:{hard:2,val:3,col:'#2b2b2b'},5:{hard:3,val:12,col:'#ffc107'},6:{hard:5,val:0,col:'#26e0a0'},
 7:{hard:3,val:0,col:'#a0a0a8'},8:{hard:8,val:0,col:'#4fc3f7'},9:{hard:0,val:0,col:'#c68642'},
 10:{hard:1.5,val:0,col:'#c0392b'},11:{hard:2,val:0,col:'#b8860b'},12:{hard:1e9,val:0,col:'#111'}
};
const HID={4:1,5:1,6:1,8:1,10:1,11:1};
const ZONES=[[0,'#8b5a2b','表土層'],[100,'#7b4f3a','紅土層'],[250,'#6a5a7a','紫晶層'],[500,'#4f6f7a','藍冰層'],[1000,'#5a5a5a','黑曜層'],[2000,'#7a3b3b','熔岩層'],[4000,'#2f2f4f','虛空層']];
const PICK_NAME=['木鏟','鐵鏟','鋼鎬','強化鎬','鑽石鎬','雷射鎬','神話鎬'];
const PICK_POW=[1,1.6,2.4,3.4,4.8,6.5,9],PICK_COST=[0,60,150,320,650,1300,2600];
const SCAN_R=[0,4,6,8,11],SCAN_CD=[0,14,11,8,5],SCAN_COST=[80,200,450,900];
const BOT_COST=[120,200,320,500],BOT_UP=[0,0,150,350,700,1400];
const SONIC_COST=150,C4_COST=60,C4_PACK=150,DET_COST=120,C4_MAX=5,C4_FUSE=5;
const BLAST=[{full:1,part:2},{full:2,part:0},{full:2,part:3},{full:3,part:0}];
const SKMAX={speed:5,luck:5,bag:5,blast:3};
const skCost=(k,lv)=>k==='blast'?lv+2:lv+1;

const HOME_LV=[{n:'小木屋',w:6,h:4,cost:0},{n:'石屋',w:8,h:5,cost:500},{n:'豪宅',w:10,h:6,cost:1500}];
const FURN=[
 {id:'bed',e:'🛏️',n:'床',cost:100,max:1,cf:4,d:'最大生命 +1'},
 {id:'bench',e:'🧰',n:'工作台',cost:120,max:1,cf:3,d:'鎬子升級價格 -10%'},
 {id:'safe',e:'🏦',n:'金庫',cost:150,max:2,cf:3,d:'賣出價格 +5%(可疊加)'},
 {id:'coffee',e:'☕',n:'咖啡機',cost:100,max:1,cf:3,d:'挖掘速度 +8%'},
 {id:'locker',e:'🗄️',n:'儲物櫃',cost:140,max:2,cf:3,d:'背包 +5 格(可疊加)'},
 {id:'cat',e:'🐱',n:'貓咪',cost:180,max:1,cf:10,d:'掃描儀冷卻 -15%'},
 {id:'plant',e:'🪴',n:'盆栽',cost:20,max:5,cf:2,d:'增加舒適度'},
 {id:'lamp',e:'💡',n:'檯燈',cost:25,max:4,cf:3,d:'增加舒適度'},
 {id:'sofa',e:'🛋️',n:'沙發',cost:60,max:3,cf:5,d:'增加舒適度'},
 {id:'paint',e:'🖼️',n:'掛畫',cost:30,max:4,cf:4,d:'增加舒適度'},
 {id:'tv',e:'📺',n:'電視',cost:90,max:2,cf:8,d:'增加舒適度'},
 {id:'trophy',e:'🏆',n:'獎盃',cost:200,max:2,cf:12,d:'增加舒適度'}
];
const FLOORS=[{n:'木地板',c:'#c8a27a',c2:'#b78d63',cost:0},{n:'磁磚',c:'#e3eaee',c2:'#cdd7dc',cost:50},{n:'地毯',c:'#9575cd',c2:'#8260c0',cost:80},{n:'草地',c:'#8bc34a',c2:'#7cb342',cost:80}];
const WALLS=[{n:'米色',c:'#ffe0b2',cost:0},{n:'天藍',c:'#b3e5fc',cost:40},{n:'粉紅',c:'#f8bbd0',cost:40},{n:'薄荷',c:'#c8e6c9',cost:40},{n:'深夜',c:'#546e7a',cost:60}];
const COMFORT_MS=[10,25,50,80,120];

// ---------- 存檔 ----------
const SAVE_KEY='goldMinerV2';
const DEF={ver:3,gold:0,gems:0,pick:1,cap:20,tnt:0,c4:0,det:false,lad:3,hat:0,best:0,cp:0,mined:0,earned:0,stars:0,
 scan:0,bots:0,botLv:1,vib:true,tomb:null,sonic:false,carry:{n:0,v:0},
 home:{lv:1,cells:{},floor:0,wall:0,ownF:[0],ownW:[0],cm:0},
 name:'礦工',snd:true,sk:{speed:0,luck:0,bag:0,blast:0},claim:{},ach:{},
 stat:{tnt:0,ladder:0,chest:0,hat:0,bot:0,scan:0,botc:0,tomb:0,c4:0},lb:[]};
let storageOK=true,lastSaveAt=0;
let save=load();
function load(){
  let s={};
  try{const raw=localStorage.getItem(SAVE_KEY);if(raw){const o=JSON.parse(raw);if(o&&typeof o==='object')s=o;}}catch(e){storageOK=false;}
  const r=Object.assign({},JSON.parse(JSON.stringify(DEF)),s);
  r.sk=Object.assign({},DEF.sk,s.sk||{});r.stat=Object.assign({},DEF.stat,s.stat||{});
  r.home=Object.assign(JSON.parse(JSON.stringify(DEF.home)),s.home||{});
  r.home.cells=r.home.cells||{};r.home.ownF=r.home.ownF||[0];r.home.ownW=r.home.ownW||[0];
  r.carry=Object.assign({n:0,v:0},s.carry||{});
  return r;
}
function persist(){
  try{
    save.ver=3;save.carry={n:cargo,v:sellValue};
    localStorage.setItem(SAVE_KEY,JSON.stringify(save));
    lastSaveAt=Date.now();storageOK=true;
  }catch(e){storageOK=false;}
}

let grid,reveal,px,py,cargo=0,sellValue=0,dig=null,keys={},stepT=0,fallT=0,gravT=0,fallDist=0,msgT=0;
let hp=3,dead=false,homeOpen=true,panelOpen=false,bgPause=false,runMax=0,shake=0,face=1;
let parts=[],camY=0,lastAchT=0,tNow=0,bots=[],scanCd=0,scanFx=null,lastScn='',tombMsg=0,lastTombTxt='';
let c4s=[],blasts=[],HC={},homeTool=null,homeTrig=false,errShown=false,zoneNow=0;

const rnd=(a,b)=>a+Math.random()*(b-a);
function recomputeHC(){HC={};for(const k in save.home.cells){const id=save.home.cells[k];HC[id]=(HC[id]||0)+1;}}
function calcComfort(){let c=save.home.lv*5;for(const k in save.home.cells){const f=FURN.find(x=>x.id===save.home.cells[k]);if(f)c+=f.cf;}return c;}
const maxHp=()=>3+(HC.bed?1:0);
const sellMul=()=>1+0.1*save.sk.luck+0.05*Math.min(HC.safe||0,2);
const capNow=()=>save.cap+5*save.sk.bag+5*Math.min(HC.locker||0,2);
const digPow=()=>PICK_POW[save.pick-1]*(1+0.12*save.sk.speed)*(HC.coffee?1.08:1);
const paused=()=>homeOpen||panelOpen||dead||bgPause;
const botFuelMax=()=>60+30*save.botLv,botPow=()=>0.8+0.5*save.botLv;
const tntP=()=>BLAST[save.sk.blast]||BLAST[0];
function c4P(){const t=tntP();return {full:t.full+1,part:t.part>0?t.part+1:t.full+2};}
function areaTxt(p){const n=2*p.full+1;return n+'×'+n+(p.part?'(外圈 50%)':'');}
function vib(ms){if(save.vib&&navigator.vibrate)try{navigator.vibrate(ms)}catch(e){}}
function checkComfort(){
  const c=calcComfort();let g=0;
  while(save.home.cm<COMFORT_MS.length&&c>=COMFORT_MS[save.home.cm]){save.home.cm++;save.stars++;g++;}
  if(g){sfx('ach');vib(40);say('🏠 舒適度達標!+'+g+' ⭐');persist();ui();}
}

function fit(){
  const st=$('stage'),w=st.clientWidth-8,h=st.clientHeight-8;
  if(w<=0||h<=0)return;
  VH=Math.max(8,Math.min(20,Math.round(15*h/w)));
  cv.width=600;cv.height=VH*T;
  const s=Math.min(w/600,h/cv.height);
  cv.style.width=(600*s)+'px';cv.style.height=(cv.height*s)+'px';
}
addEventListener('resize',fit);
addEventListener('orientationchange',()=>setTimeout(fit,250));
if(window.ResizeObserver)new ResizeObserver(fit).observe($('stage'));

let AC=null;
function sfx(type){
  if(!save.snd)return;
  try{
    AC=AC||new (window.AudioContext||window.webkitAudioContext)();
    if(AC.state==='suspended')AC.resume();
    const o=AC.createOscillator(),g=AC.createGain(),t=AC.currentTime;
    const P={dig:[180,90,.05,'square',.04],coin:[780,1250,.12,'triangle',.08],boom:[120,30,.35,'sawtooth',.18],
      hurt:[300,80,.25,'square',.12],buy:[500,900,.15,'triangle',.08],ach:[600,1400,.4,'triangle',.1],
      scan:[300,1200,.5,'sine',.1],tick:[900,700,.04,'square',.04]}[type];
    o.type=P[3];o.frequency.setValueAtTime(P[0],t);o.frequency.exponentialRampToValueAtTime(P[1],t+P[2]);
    g.gain.setValueAtTime(P[4],t);g.gain.exponentialRampToValueAtTime(.0001,t+P[2]);
    o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+P[2]);
  }catch(e){}
}

function burst(x,y,col,n=8){for(let i=0;i<n;i++)parts.push({x:x*T+20,y:y*T+20,vx:rnd(-90,90),vy:rnd(-120,20),life:rnd(.3,.7),col});}

const depthOf=r=>Math.max(0,r-SURF+1);
const isCP=(r,c)=>r>SURF&&(r-SURF)%CPGAP===0&&c>=4&&c<=10;
const passable=t=>t===0||t===9;
function zoneIdx(gy){const d=depthOf(gy);let i=0;for(let k=0;k<ZONES.length;k++)if(d>=ZONES[k][0])i=k;return i;}
const zoneCol=gy=>ZONES[zoneIdx(gy)][1];
function genRow(r){
  const d=r-SURF,row=[];
  const cp=d>0&&d%CPGAP===0,aboveCp=(d+1)>0&&(d+1)%CPGAP===0,belowCp=d>1&&(d-1)%CPGAP===0;
  const hardHi=d>35?Math.min(.6,.33+(d-35)/2000):0,rich=d>300;
  for(let c=0;c<COLS;c++){
    if(r<SURF){row.push(0);continue;}
    const x=Math.random();let t=TY.DIRT;
    if(d>8&&x<0.25)t=TY.STONE;
    if(d>35&&x<hardHi)t=TY.HARD;
    if(x>0.90)t=TY.COAL;
    if(d>6&&x>0.955)t=TY.GOLD;
    if(d>18&&x>(rich?0.97:0.978))t=TY.GEM;
    if(d>70&&x>(rich?0.99:0.994))t=TY.DIAM;
    if(d>4&&x>0.80&&x<0.835)t=TY.BOULDER;
    if(d>12&&x>0.76&&x<0.78)t=TY.BARREL;
    if(d>5&&x>0.74&&x<0.755)t=TY.CHEST;
    if(c>=4&&c<=10){
      if(cp)t=0;
      else if(belowCp)t=TY.STONE;
      else if(aboveCp&&t===TY.BOULDER)t=TY.DIRT;
    }
    row.push(t);
  }
  return row;
}
function need(target){
  while(grid.length<target){grid.push(genRow(grid.length));reveal.push(new Uint8Array(COLS));}
  ROWS=grid.length;
}
function genWorld(){grid=[];reveal=[];ROWS=0;need(SURF+120);}
function applyTomb(){

  need(t.y+VH+60);

}
function revealAround(x,y,r){
  for(let yy=y-r;yy<=y+r;yy++)for(let xx=x-r;xx<=x+r;xx++){
    if(yy<0||yy>=ROWS||xx<0||xx>=COLS)continue;
    if(reveal[yy][xx]===0)reveal[yy][xx]=1;
  }
}

function blast(cx,cy,full,part,hurtP,depth=0){
  if(depth>30)return;
  sfx('boom');vib(80);shake=Math.max(shake,.3+.1*full);
  const R=Math.max(full,part),chainB=[];
  for(let y=cy-R;y<=cy+R;y++)for(let x=cx-R;x<=cx+R;x++){
    if(x<0||x>=COLS||y<SURF||y>=ROWS-1)continue;
    if(x===px&&y===py)continue;
    const dist=Math.max(Math.abs(x-cx),Math.abs(y-cy));
    if(!(dist<=full||(part>0&&dist===part&&Math.random()<.5)))continue;
    if(grid[y][x]===TY.BARREL){grid[y][x]=0;save.mined++;burst(x,y,'#ff7043',6);chainB.push([x,y]);continue;}
    removeTile(x,y);
  }
  blasts.push({x:cx,y:cy,r:R+.5,t:0});
  burst(cx,cy,'#ff9800',16+full*6);
  if(hurtP&&Math.abs(px-cx)<=full&&Math.abs(py-cy)<=full)hurt(1,'被爆炸波及');
  for(const[bx,by]of chainB)blast(bx,by,1,0,true,depth+1);
  for(const c of c4s.slice()){
    if(Math.max(Math.abs(c.x-cx),Math.abs(c.y-cy))<=full){
      const i=c4s.indexOf(c);if(i>=0){c4s.splice(i,1);c4Blast(c,depth+1);}
    }
  }
}

function botMine(b,x,y){

function updateBots(dt){
  for(let i=bots.length-1;i>=0;i--){
    const b=bots[i];
    need(b.y+25);

    else if(b.armed){
      const g=Math.round(b.store*sellMul());
      save.gold+=g;save.earned+=g;save.stat.botc++;
      bots.splice(i,1);sfx('coin');vib(30);say('🤖 收回挖礦機 +'+g+' 💰');persist();ui();continue;
    }
    if(b.fuel<=0)continue;
    b.fuel-=dt;
    const ny=b.y+1;
    if(ny>=ROWS-1){b.fuel=0;continue;}
    const t=grid[ny][b.x];
    if(passable(t)){b.mt+=dt;if(b.mt>=.3){b.y++;b.mt=0;revealAround(b.x,b.y,1);}continue;}
    b.p+=dt;
    if(Math.random()<.08)burst(b.x,ny,INFO[t].col,2);
    if(b.p>=INFO[t].hard/botPow()){botMine(b,b.x,ny);b.p=0;b.y++;revealAround(b.x,b.y,1);}
  }
}

function airborne(){return py+1<ROWS&&grid[py+1][px]===0&&grid[py][px]!==TY.LADDER&&py>=SURF-1;}
function stepOrDig(dx,dy,dt){
  const nx=px+dx,ny=py+dy;
  if(nx<0||nx>=COLS||ny<SURF-1||ny>=ROWS)return;
  const t=grid[ny][nx];
  if(dx)face=dx;

    if(dy<0&&!(grid[py][px]===TY.LADDER||t===TY.LADDER))return;
    px=nx;py=ny;dig=null;stepT=.11;onArrive();return;
  }
  if(!dig||dig.x!==nx||dig.y!==ny)dig={x:nx,y:ny,p:0,need:INFO[t].hard/digPow()};
  dig.p+=dt;
  if(Math.random()<.2)sfx('dig');
  if(dig.p>=dig.need){
    const bt=t;removeTile(nx,ny);dig=null;
    if(bt===TY.BARREL)blast(nx,ny,1,0,true);

}

function update(dt){
  if(msgT>0){msgT-=dt;if(msgT<=0)$('msg').style.opacity=0;}
  for(const p of parts){p.life-=dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=380*dt;}
  parts=parts.filter(p=>p.life>0);
  for(const b of blasts)b.t+=dt;
  blasts=blasts.filter(b=>b.t<.45);
  if(shake>0)shake-=dt;
  if(scanFx){scanFx.t+=dt;if(scanFx.t>.9)scanFx=null;}
  if(paused())return;
  need(py+VH+60);
  stepT-=dt;fallT-=dt;gravT-=dt;
  if(tombMsg>0)tombMsg-=dt;
  if(scanCd>0)scanCd=Math.max(0,scanCd-dt);
  const lbl=save.scan===0?'未購買':(scanCd>0?Math.ceil(scanCd)+'s':'OK');
  if(lbl!==lastScn){$('scn').textContent=lbl;lastScn=lbl;}
  updateBots(dt);updateC4(dt);checkTomb();updateTombPill();
  if(gravT<=0){
    gravT=.08;
    if(airborne()){py++;fallDist++;dig=null;onArrive();}
    else if(fallDist>0){if(fallDist>=7)hurt(1,'摔傷了');fallDist=0;}
  }
  const air=airborne();
  let dx=0,dy=0;
  if(keys.left)dx=-1;else if(keys.right)dx=1;else if(keys.up)dy=-1;else if(keys.down)dy=1;
  if(!air&&(dx||dy)){
    const nx=px+dx,ny=py+dy;
    const t=(nx>=0&&nx<COLS&&ny>=0&&ny<ROWS)?grid[ny][nx]:-1;
    if(t>0&&!passable(t))stepOrDig(dx,dy,dt);
    else if(stepT<=0)stepOrDig(dx,dy,dt);
  }else if(!dx&&!dy)dig=null;
  if(fallT<=0){fallBoulders();fallT=.18;}

}

function draw(){
  need(py+VH+60);
  camY=Math.max(0,Math.min(ROWS-VH,py-Math.floor(VH/2)));
  ctx.save();
  if(shake>0)ctx.translate(rnd(-5,5),rnd(-5,5));
  ctx.fillStyle='#6ec6ff';ctx.fillRect(0,0,cv.width,cv.height);
  for(let r=0;r<VH;r++){
    const gy=camY+r;if(gy>=ROWS)break;
    for(let c=0;c<COLS;c++){
      const t=grid[gy][c],sx=c*T,sy=r*T;
      if(gy<SURF){if(gy===SURF-1){ctx.fillStyle='#4caf50';ctx.fillRect(sx,sy+T-8,T,8);}continue;}
      if(t===0){ctx.fillStyle=isCP(gy,c)?'#3a2a1c':'#2a1c12';ctx.fillRect(sx,sy,T,T);}
      else if(t===9)drawLadder(sx,sy);
      else{
        const rv=reveal[gy][c];
        drawTile(HID[t]&&!rv?1:t,sx,sy,gy);
        if(HID[t]&&rv===2){ctx.strokeStyle='rgba(255,235,59,'+(.55+.45*Math.sin(tNow/180))+')';ctx.lineWidth=3;ctx.strokeRect(sx+2,sy+2,T-4,T-4);ctx.lineWidth=1;}
      }

  const sr=SURF-1-camY;

    ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(120,40-camY*T,22,0,7);ctx.arc(150,45-camY*T,28,0,7);ctx.arc(185,40-camY*T,20,0,7);ctx.fill();
    ctx.beginPath();ctx.arc(420,70-camY*T,18,0,7);ctx.arc(445,74-camY*T,24,0,7);ctx.arc(472,70-camY*T,16,0,7);ctx.fill();

    drawHouse();
  }
  for(let r=0;r<VH;r++){

    if(gy>SURF&&(gy-SURF)%CPGAP===0){ctx.fillStyle='#fff';ctx.fillRect(7*T+18,r*T+4,3,32);ctx.fillStyle=(gy<=save.cp)?'#4caf50':'#ff7043';ctx.fillRect(7*T+21,r*T+5,16,11);}

  if(dig){const dxx=dig.x*T,dyy=(dig.y-camY)*T;ctx.fillStyle='rgba(0,0,0,.55)';ctx.fillRect(dxx+4,dyy+T-10,T-8,6);ctx.fillStyle='#ffeb3b';ctx.fillRect(dxx+4,dyy+T-10,(T-8)*Math.min(1,dig.p/dig.need),6);}
  drawBlasts();
  for(const p of parts){ctx.globalAlpha=Math.max(0,p.life*2);ctx.fillStyle=p.col;ctx.fillRect(p.x,p.y-camY*T,5,5);}
  ctx.globalAlpha=1;
  if(scanFx){const k=scanFx.t/.9;ctx.strokeStyle='rgba(0,229,255,'+(1-k)+')';ctx.lineWidth=4;ctx.beginPath();ctx.arc(scanFx.x*T+20,(scanFx.y-camY)*T+20,k*scanFx.R*T,0,7);ctx.stroke();ctx.lineWidth=1;}
  ctx.fillStyle='rgba(0,0,10,'+(Math.min(1,depthOf(py)/200)*0.6)+')';ctx.fillRect(0,0,cv.width,cv.height);
  ctx.restore();
  const WIN=200,wi=Math.max(0,Math.floor((py-SURF)/WIN));
  const bp=y=>{const f=(y-SURF-wi*WIN)/WIN;return(f>=0&&f<=1)?10+(cv.height-20)*f:-99;};
  const pf=Math.min(1,Math.max(0,(py-SURF-wi*WIN)/WIN));
  ctx.fillStyle='rgba(0,0,0,.4)';ctx.fillRect(cv.width-10,10,6,cv.height-20);
  ctx.fillStyle='#ffd54a';ctx.fillRect(cv.width-10,10+(cv.height-20)*pf,6,10);
  ctx.fillStyle='#00e5ff';for(const b of bots)ctx.fillRect(cv.width-12,bp(b.y),10,4);
  if(save.tomb&&save.sonic){ctx.fillStyle='#b9f6ca';ctx.fillRect(cv.width-12,bp(save.tomb.y),10,4);}
}

function buy(k,cost){
  if(save.gold<cost){say('金幣不夠!');vib(60);return;}
  save.gold-=cost;
  if(k==='pick')save.pick++;
  if(k==='cap')save.cap+=10;
  if(k==='tnt')save.tnt++;
  if(k==='tnt5')save.tnt+=5;
  if(k==='c4')save.c4++;
  if(k==='c43')save.c4+=3;
  if(k==='det')save.det=true;
  if(k==='lad')save.lad+=10;
  if(k==='hat')save.hat++;
  if(k==='scan')save.scan++;
  if(k==='bot')save.bots++;
  if(k==='botup')save.botLv++;
  if(k==='sonic')save.sonic=true;
  sfx('buy');vib(25);persist();ui();render();
}
function upSkill(k){
  const lv=save.sk[k];if(lv>=SKMAX[k])return;
  const c=skCost(k,lv);
  if(save.stars<c){say('技能點不夠');return;}
  save.stars-=c;save.sk[k]++;sfx('buy');vib(25);persist();ui();render();
}
function claim(id){
  const q=QUEST.find(x=>x.id===id);
  if(!q||save.claim[id]||q.g()<q.goal)return;
  save.claim[id]=1;save.gems+=q.gems;sfx('ach');vib(40);persist();ui();render();
}

const pad=$('pad');let padId=null;
function setDir(d){pad.dataset.dir=d;}
function padSet(e){
  const r=pad.getBoundingClientRect(),x=e.clientX-(r.left+r.width/2),y=e.clientY-(r.top+r.height/2);
  keys.left=keys.right=keys.up=keys.down=false;
  if(Math.hypot(x,y)<r.width*.12){setDir('');return;}
  const d=Math.abs(x)>Math.abs(y)?(x<0?'left':'right'):(y<0?'up':'down');
  keys[d]=true;setDir(d);
}
pad.addEventListener('pointerdown',e=>{e.preventDefault();padId=e.pointerId;try{pad.setPointerCapture(e.pointerId)}catch(_){}padSet(e);});
pad.addEventListener('pointermove',e=>{if(e.pointerId===padId)padSet(e);});
const padEnd=e=>{if(e.pointerId===padId){padId=null;keys.left=keys.right=keys.up=keys.down=false;setDir('');}};
