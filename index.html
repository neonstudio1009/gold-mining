<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#14112a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="黃金挖礦工">
<title>⛏️ 黃金挖礦工 Gold Miner</title>
<link rel="icon" type="image/svg+xml" href="gold-miner-app-logo.svg">
<link rel="apple-touch-icon" href="gold-miner-app-logo.svg">
<style>
:root{--sat:env(safe-area-inset-top,0px);--sab:env(safe-area-inset-bottom,0px);--sal:env(safe-area-inset-left,0px);--sar:env(safe-area-inset-right,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
html,body{height:100%;margin:0;overflow:hidden;overscroll-behavior:none;background:#0f0d1c}
body{color:#fff;font-family:"Microsoft JhengHei","PingFang TC",sans-serif;touch-action:none;
  background:radial-gradient(circle at top,#2a2550,#0f0d1c 70%)}
#app{position:relative;height:100vh;height:100dvh;display:flex;flex-direction:column;
  padding:var(--sat) var(--sar) 0 var(--sal);max-width:760px;margin:0 auto}

/* ===== HUD ===== */
#hud{display:flex;align-items:center;gap:5px;padding:6px 8px 4px;flex-wrap:wrap}
.pill{background:rgba(42,38,64,.9);padding:4px 8px;border-radius:10px;font-size:12.5px;white-space:nowrap;border:1px solid #3b3566}
#menuBtn{margin-left:auto;width:42px;height:34px;border:0;border-radius:10px;background:#ffb300;color:#222;font-size:19px;font-weight:bold}
#menuBtn:active{transform:scale(.94)}

/* ===== 遊戲畫面 ===== */
#stage{flex:1;min-height:0;position:relative;display:flex;align-items:center;justify-content:center;padding:4px}
canvas{border-radius:12px;border:2px solid #3b3566;background:#6ec6ff;touch-action:none;box-shadow:0 6px 24px rgba(0,0,0,.45)}
#msg{position:absolute;top:10px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,.75);padding:6px 14px;border-radius:20px;font-size:13.5px;opacity:0;transition:.25s;pointer-events:none;white-space:nowrap;max-width:94%;overflow:hidden;text-overflow:ellipsis;z-index:3}

/* ===== 控制區 ===== */
#ctrl{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:8px 14px calc(10px + var(--sab));background:linear-gradient(to top,rgba(0,0,0,.35),transparent)}
#pad{position:relative;width:148px;height:148px;border-radius:50%;flex:none;touch-action:none;
  background:radial-gradient(circle,rgba(70,62,120,.95) 0 28%,rgba(46,41,84,.9) 29% 100%);border:2px solid #4a4380}
#pad i{position:absolute;font-style:normal;font-size:22px;color:#cfc9f0;transition:.08s}
#pad .u{top:8px;left:50%;transform:translateX(-50%)}
#pad .d{bottom:8px;left:50%;transform:translateX(-50%)}
#pad .l{left:12px;top:50%;transform:translateY(-50%)}
#pad .r{right:12px;top:50%;transform:translateY(-50%)}
#pad .k{position:absolute;left:50%;top:50%;width:46px;height:46px;margin:-23px 0 0 -23px;border-radius:50%;background:#7c4dff;box-shadow:0 2px 8px rgba(0,0,0,.5);transition:transform .06s}
#pad[data-dir=up] .k{transform:translateY(-26px)}
#pad[data-dir=down] .k{transform:translateY(26px)}
#pad[data-dir=left] .k{transform:translateX(-26px)}
#pad[data-dir=right] .k{transform:translateX(26px)}
#pad[data-dir=up] .u,#pad[data-dir=down] .d,#pad[data-dir=left] .l,#pad[data-dir=right] .r{color:#ffd54a}
#acts{display:grid;grid-template-columns:repeat(3,62px);gap:8px;flex:none}
.ab{position:relative;height:62px;border:0;border-radius:16px;background:#3a3560;color:#fff;font-family:inherit;
  display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:11px;line-height:1.25;touch-action:none;
  border-bottom:3px solid #231f45}
.ab .i{font-size:22px;line-height:1}
.ab:active{transform:scale(.93);background:#5a4fa5}
.ab.cyan{background:#0a7f8c;border-bottom-color:#065660}
.ab.green{background:#2a8a53;border-bottom-color:#17592f}
.ab.red{background:#c53030;border-bottom-color:#7a1b1b}

/* ===== 橫向手機:控制鍵浮在畫面兩側 ===== */
@media (orientation:landscape) and (max-height:560px){
  #app{max-width:none}
  #hud{position:absolute;top:var(--sat);left:50%;transform:translateX(-50%);z-index:4;padding:4px;flex-wrap:nowrap}
  #menuBtn{margin-left:6px}
  #ctrl{position:absolute;left:0;right:0;bottom:0;z-index:4;padding:0 calc(14px + var(--sar)) calc(8px + var(--sab)) calc(14px + var(--sal));
    pointer-events:none;align-items:flex-end;background:none}
  #ctrl>*{pointer-events:auto;opacity:.88}
  #pad{width:128px;height:128px}
  #pad .k{width:40px;height:40px;margin:-20px 0 0 -20px}
  #acts{grid-template-columns:repeat(3,52px);gap:6px}
  .ab{height:52px;font-size:10px}.ab .i{font-size:19px}
  #stage{padding:0}
}
@media (max-width:350px){#acts{grid-template-columns:repeat(3,54px)}.ab{height:54px}#pad{width:130px;height:130px}}

/* ===== 按鈕 ===== */
.btn{background:#7c4dff;color:#fff;border:0;border-radius:12px;padding:10px 14px;font-size:15px;cursor:pointer;font-family:inherit;min-height:42px}
.btn:active{transform:scale(.96)}
.btn.gold{background:#ffb300;color:#222;font-weight:bold}
.btn.red{background:#e53935}
.btn.green{background:#2e9e5b}
.btn:disabled{opacity:.4}

/* ===== 底部彈出選單 ===== */
.modal{position:fixed;inset:0;background:rgba(0,0,0,.72);display:none;align-items:flex-end;justify-content:center;z-index:30}
.modal.center{align-items:center}
.box{background:#231f38;width:100%;max-width:560px;max-height:88vh;max-height:88dvh;display:flex;flex-direction:column;
  border-radius:22px 22px 0 0;border:2px solid #3f3870;border-bottom:0;animation:up .22s ease-out}
.modal.center .box{border-radius:22px;border-bottom:2px solid #3f3870;width:92%;padding:18px}
@keyframes up{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
.tabs{display:flex;gap:6px;overflow-x:auto;padding:12px 12px 8px;flex:none;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs button{flex:none;padding:8px 12px;border:0;border-radius:12px;background:#3a3560;color:#fff;font-size:13.5px;font-family:inherit;white-space:nowrap}
.tabs button.on{background:#ffb300;color:#222;font-weight:bold}
#content{flex:1;overflow-y:auto;padding:4px 14px 8px;touch-action:pan-y;-webkit-overflow-scrolling:touch}
.foot{padding:8px 14px calc(12px + var(--sab));flex:none}
.item{display:flex;justify-content:space-between;align-items:center;background:#2f2a4d;padding:10px 11px;border-radius:12px;margin:7px 0;font-size:14px;gap:10px;line-height:1.45}
.item small{color:#b9b3d9}
.item.done{opacity:.55}
.item .btn{flex:none;min-width:74px}
.bar{height:8px;background:#1b1830;border-radius:6px;overflow:hidden;margin-top:5px}
.bar i{display:block;height:100%;background:#ffd54a}
h2{margin:0 0 8px;color:#ffd54a;font-size:19px}
input[type=text]{background:#171428;border:1px solid #4a4380;color:#fff;padding:10px;border-radius:10px;width:100%;font-size:16px;font-family:inherit;-webkit-user-select:text;user-select:text}
table{width:100%;border-collapse:collapse;font-size:14px}
td,th{padding:7px;text-align:center;border-bottom:1px solid #3a3560}

/* ===== 首頁 ===== */
#home{position:fixed;inset:0;z-index:40;background:radial-gradient(circle at 50% 28%,#3a2f78,#0d0b18 75%);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:11px;text-align:center;
  padding:calc(20px + var(--sat)) 20px calc(20px + var(--sab));overflow:auto;touch-action:pan-y}
#home img{width:min(34vw,140px);height:min(34vw,140px);border-radius:28px;box-shadow:0 10px 40px rgba(255,200,0,.35)}
#home h2{font-size:30px;margin:0}
#home p{margin:0;color:#cfc9f0;max-width:340px;font-size:14px;line-height:1.65}
#home .btn{width:min(78vw,260px);font-size:18px;padding:13px}
#home .sub{font-size:13px;color:#8f89b8}
@media (orientation:landscape) and (max-height:480px){#home img{display:none}#home h2{font-size:24px}#home{gap:7px}}
</style>
</head>
<body>

<div id="home">
  <img src="gold-miner-app-logo.svg" alt="" onerror="this.style.display='none'">
  <h2>⛏️ 黃金挖礦工</h2>
  <p>往地底挖得越深,寶藏越值錢!用掃描儀找礦、派挖礦機自動挖,小心落石與爆炸桶!</p>
  <button class="btn gold" id="startBtn">▶ 開始遊戲</button>
  <button class="btn" id="homeShop">🛒 商店 / 科技 / 任務</button>
  <button class="btn" id="fsBtn" style="font-size:15px;padding:10px">⛶ 全螢幕</button>
  <p id="homeInfo"></p>
  <p class="sub">提示:用瀏覽器選單「加入主畫面」,就能像 APP 一樣全螢幕開啟</p>
</div>

<div id="app">
  <div id="hud">
    <span class="pill" id="hp">❤️❤️❤️</span>
    <span class="pill">💰 <b id="gold">0</b></span>
    <span class="pill">💎 <b id="gems">0</b></span>
    <span class="pill">🎒 <b id="cargo">0</b>/<b id="cap">20</b></span>
    <span class="pill">📏 <b id="depth">0</b>m</span>
    <button id="menuBtn" aria-label="選單">☰</button>
  </div>

  <div id="stage">
    <canvas id="c" width="600" height="480"></canvas>
    <div id="msg"></div>
  </div>

  <div id="ctrl">
    <div id="pad" data-dir="">
      <i class="u">▲</i><i class="d">▼</i><i class="l">◀</i><i class="r">▶</i>
      <div class="k"></div>
    </div>
    <div id="acts">
      <button class="ab" id="tntBtn"><span class="i">💣</span><span>TNT <b id="tnt">0</b></span></button>
      <button class="ab" id="ladBtn"><span class="i">🪜</span><span>梯子 <b id="lad">0</b></span></button>
      <button class="ab cyan" id="scanBtn"><span class="i">📡</span><span>掃描 <b id="scn">-</b></span></button>
      <button class="ab cyan" id="botBtn"><span class="i">🤖</span><span>機器 <b id="botn">0/0</b></span></button>
      <button class="ab green" id="cpBtn"><span class="i">⛺</span><span>存檔點</span></button>
      <button class="ab red" id="upBtn"><span class="i">⬆️</span><span>回地面</span></button>
    </div>
  </div>
</div>

<div class="modal" id="panel">
  <div class="box">
    <div class="tabs" id="tabs"></div>
    <div id="content"></div>
    <div class="foot"><button class="btn" style="width:100%" onclick="closePanel()">關閉</button></div>
  </div>
</div>

<div class="modal center" id="death">
  <div class="box" style="text-align:center">
    <h2 id="deathTitle">💀 你倒下了</h2>
    <p id="deathText" style="color:#cfc9f0;font-size:14px;line-height:1.6"></p>
    <button class="btn gold" style="width:100%;margin:6px 0" id="reviveBtn">💎 3 寶石原地復活</button>
    <button class="btn" style="width:100%" id="respBtn">⛺ 回到存檔點重來</button>
  </div>
</div>

<script>
const COLS=15,ROWS=320,T=40,SURF=3,CPGAP=50;
let VH=12;
const $=id=>document.getElementById(id);
const cv=$('c'),ctx=cv.getContext('2d');

const TY={EMPTY:0,DIRT:1,STONE:2,HARD:3,COAL:4,GOLD:5,GEM:6,BOULDER:7,DIAM:8,LADDER:9,BARREL:10,CHEST:11,BEDROCK:12};
const INFO={
 1:{hard:1,val:0,col:'#8b5a2b'},
 2:{hard:2.5,val:0,col:'#7d7d85'},
 3:{hard:5,val:0,col:'#4a4a55'},
 4:{hard:2,val:3,col:'#2b2b2b'},
 5:{hard:3,val:12,col:'#ffc107'},
 6:{hard:5,val:0,col:'#26e0a0'},
 7:{hard:3,val:0,col:'#a0a0a8'},
 8:{hard:8,val:0,col:'#4fc3f7'},
 10:{hard:1.5,val:0,col:'#c0392b'},
 11:{hard:2,val:0,col:'#b8860b'},
 12:{hard:1e9,val:0,col:'#111'}
};
const HID={4:1,5:1,6:1,8:1,10:1,11:1};
const PICK_NAME=['木鏟','鐵鏟','鋼鎬','強化鎬','鑽石鎬','雷射鎬','神話鎬'];
const PICK_POW=[1,1.6,2.4,3.4,4.8,6.5,9];
const PICK_COST=[0,60,150,320,650,1300,2600];
const SCAN_R=[0,4,6,8,11];
const SCAN_CD=[0,14,11,8,5];
const SCAN_COST=[80,200,450,900];
const BOT_COST=[120,200,320,500];
const BOT_UP=[0,0,150,350,700,1400];

const DEF={gold:0,gems:0,pick:1,cap:20,tnt:0,lad:3,hat:0,best:0,cp:0,mined:0,earned:0,stars:0,
  scan:0,bots:0,botLv:1,vib:true,
  name:'礦工',snd:true,sk:{speed:0,luck:0,bag:0},claim:{},ach:{},stat:{tnt:0,ladder:0,chest:0,hat:0,bot:0,scan:0,botc:0},lb:[]};
let save=load();
function load(){
  let s={};try{s=JSON.parse(localStorage.getItem('goldMinerV2')||'{}')}catch(e){}
  const r=Object.assign({},JSON.parse(JSON.stringify(DEF)),s);
  r.sk=Object.assign({},DEF.sk,s.sk||{});r.stat=Object.assign({},DEF.stat,s.stat||{});
  return r;
}
function persist(){localStorage.setItem('goldMinerV2',JSON.stringify(save));}

let grid,reveal,px,py,cargo=0,sellValue=0,dig=null,keys={},stepT=0,fallT=0,gravT=0,fallDist=0,msgT=0;
let hp=3,dead=false,homeOpen=true,panelOpen=false,bgPause=false,runMax=0,shake=0,face=1;
let parts=[],camY=0,lastAchT=0,tNow=0;
let bots=[],scanCd=0,scanFx=null,lastScn='';

const rnd=(a,b)=>a+Math.random()*(b-a);
const capNow=()=>save.cap+5*save.sk.bag;
const digPow=()=>PICK_POW[save.pick-1]*(1+0.12*save.sk.speed);
const paused=()=>homeOpen||panelOpen||dead||bgPause;
const botFuelMax=()=>60+30*save.botLv;
const botPow=()=>0.8+0.5*save.botLv;
function vib(ms){if(save.vib&&navigator.vibrate)try{navigator.vibrate(ms)}catch(e){}}

// ---------- 版面自適應 ----------
function fit(){
  const st=$('stage');
  const w=st.clientWidth-8,h=st.clientHeight-8;
  if(w<=0||h<=0)return;
  VH=Math.max(8,Math.min(20,Math.round(15*h/w)));
  cv.width=600;cv.height=VH*T;
  const s=Math.min(w/600,h/cv.height);
  cv.style.width=(600*s)+'px';cv.style.height=(cv.height*s)+'px';
}
addEventListener('resize',fit);
addEventListener('orientationchange',()=>setTimeout(fit,250));
if(window.ResizeObserver)new ResizeObserver(fit).observe($('stage'));

// ---------- 音效 ----------
let AC=null;
function sfx(type){
  if(!save.snd)return;
  try{
    AC=AC||new (window.AudioContext||window.webkitAudioContext)();
    if(AC.state==='suspended')AC.resume();
    const o=AC.createOscillator(),g=AC.createGain();
    const t=AC.currentTime;
    const P={dig:[180,90,.05,'square',.04],coin:[780,1250,.12,'triangle',.08],boom:[120,30,.35,'sawtooth',.18],
      hurt:[300,80,.25,'square',.12],buy:[500,900,.15,'triangle',.08],ach:[600,1400,.4,'triangle',.1],
      scan:[300,1200,.5,'sine',.1]}[type];
    o.type=P[3];o.frequency.setValueAtTime(P[0],t);o.frequency.exponentialRampToValueAtTime(P[1],t+P[2]);
    g.gain.setValueAtTime(P[4],t);g.gain.exponentialRampToValueAtTime(.0001,t+P[2]);
    o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+P[2]);
  }catch(e){}
}
function say(s){const m=$('msg');m.textContent=s;m.style.opacity=1;msgT=1.8;}
function burst(x,y,col,n=8){for(let i=0;i<n;i++)parts.push({x:x*T+20,y:y*T+20,vx:rnd(-90,90),vy:rnd(-120,20),life:rnd(.3,.7),col});}

// ---------- 世界 ----------
function genWorld(){
  grid=[];reveal=[];
  for(let r=0;r<ROWS;r++){
    const row=[];
    reveal.push(new Uint8Array(COLS));
    for(let c=0;c<COLS;c++){
      if(r<SURF){row.push(0);continue;}
      if(r===ROWS-1){row.push(TY.BEDROCK);continue;}
      const d=r-SURF,x=Math.random();
      let t=TY.DIRT;
      if(d>8&&x<0.25)t=TY.STONE;
      if(d>35&&x<0.33)t=TY.HARD;
      if(x>0.90)t=TY.COAL;
      if(d>6&&x>0.955)t=TY.GOLD;
      if(d>18&&x>0.978)t=TY.GEM;
      if(d>70&&x>0.994)t=TY.DIAM;
      if(d>4&&x>0.80&&x<0.835)t=TY.BOULDER;
      if(d>12&&x>0.76&&x<0.78)t=TY.BARREL;
      if(d>5&&x>0.74&&x<0.755)t=TY.CHEST;
      row.push(t);
    }
    grid.push(row);
  }
  for(let k=1;SURF+CPGAP*k<ROWS-2;k++){
    const r=SURF+CPGAP*k;
    for(let c=4;c<=10;c++){grid[r][c]=0;grid[r+1][c]=TY.STONE;grid[r-1][c]=(grid[r-1][c]===TY.BOULDER?TY.DIRT:grid[r-1][c]);}
  }
}
function revealAround(x,y,r){
  for(let yy=y-r;yy<=y+r;yy++)for(let xx=x-r;xx<=x+r;xx++){
    if(yy<0||yy>=ROWS||xx<0||xx>=COLS)continue;
    if(reveal[yy][xx]===0)reveal[yy][xx]=1;
  }
}
const isCP=(r,c)=>r>SURF&&(r-SURF)%CPGAP===0&&c>=4&&c<=10;
const passable=t=>t===0||t===9;
const depthOf=r=>Math.max(0,r-SURF+1);

// ---------- 狀態 ----------
function respawn(r){px=7;py=r;cargo=0;sellValue=0;dig=null;fallDist=0;hp=3;dead=false;$('death').style.display='none';revealAround(px,py,1);ui();}
function ui(){
  $('gold').textContent=save.gold;$('gems').textContent=save.gems;
  $('cargo').textContent=cargo;$('cap').textContent=capNow();
  $('depth').textContent=depthOf(py);$('tnt').textContent=save.tnt;$('lad').textContent=save.lad;
  $('botn').textContent=(save.bots-bots.length)+'/'+save.bots;
  $('hp').textContent='❤️'.repeat(Math.max(0,hp))+'🖤'.repeat(Math.max(0,3-hp))+(save.hat>0?'⛑️'+save.hat:'');
  $('homeInfo').textContent='最深紀錄 '+save.best+'m ｜ ⭐ 技能點 '+save.stars;
}
function sell(){
  if(cargo<=0)return;
  const v=Math.round(sellValue*(1+0.1*save.sk.luck));
  save.gold+=v;save.earned+=v;cargo=0;sellValue=0;sfx('coin');say('賣出礦物 +'+v+' 💰');persist();ui();
}
function onArrive(){
  const d=depthOf(py);
  revealAround(px,py,1);
  if(d>runMax)runMax=d;
  if(d>save.best){
    const gain=Math.floor(d/20)-Math.floor(save.best/20);
    save.best=d;if(gain>0){save.stars+=gain;say('⭐ 獲得 '+gain+' 技能點!');}
    persist();
  }
  if(isCP(py,px)){
    if(py>save.cp){save.cp=py;say('⛺ 存檔點已記錄!');persist();}
    hp=3;
  }
  if(py<SURF){hp=3;sell();}
  ui();
}
function addOre(t){
  const v=INFO[t].val;if(v<=0)return;
  if(cargo>=capNow()){say('🎒 背包滿了!回地面賣掉');return;}
  cargo++;sellValue+=v*(1+depthOf(py)/120);
}
function collect(t,x,y){
  if(t===TY.GEM){save.gems+=1;sfx('coin');say('💎 +1 寶石');}
  else if(t===TY.DIAM){save.gems+=3;sfx('coin');say('💠 鑽石!+3 寶石');}
  else if(t===TY.CHEST){
    save.stat.chest++;sfx('ach');vib(40);
    const r=Math.random(),d=depthOf(y);
    if(r<.45){const g=Math.round(rnd(25,70)*(1+d/50));save.gold+=g;save.earned+=g;say('📦 寶箱:+'+g+' 金幣');}
    else if(r<.7){const n=1+Math.floor(Math.random()*2);save.gems+=n;say('📦 寶箱:+'+n+' 寶石');}
    else if(r<.85){save.tnt+=2;say('📦 寶箱:+2 TNT');}
    else{const n=3+Math.floor(Math.random()*4);save.lad+=n;say('📦 寶箱:+'+n+' 梯子');}
  }
  else addOre(t);
}
function removeTile(x,y,loot=true){
  const t=grid[y][x];
  if(t===0||t===TY.BEDROCK)return;
  grid[y][x]=0;
  if(t!==TY.LADDER)save.mined++;
  if(loot)collect(t,x,y);
  burst(x,y,INFO[t]?INFO[t].col:'#999',6);
}
function hurt(n,why){
  if(dead)return;
  hp-=n;sfx('hurt');vib(120);shake=.3;say('💢 '+why);ui();

}
function die(why){
  dead=true;recordRun();vib([100,60,200]);

  $('deathText').textContent=why+'。背包裡的礦物遺失了。目前深度 '+depthOf(py)+'m,存檔點 '+depthOf(save.cp||SURF)+'m。';
  $('reviveBtn').disabled=save.gems<3;
  $('death').style.display='flex';
  keys={};setDir('');
  cargo=0;sellValue=0;ui();
}
function recordRun(){
  if(runMax>=5){
    save.lb.push({name:save.name,depth:runMax,gold:save.earned,t:new Date().toLocaleDateString()});
    save.lb.sort((a,b)=>b.depth-a.depth);save.lb=save.lb.slice(0,10);persist();
  }
  runMax=depthOf(py);
}
function explodeAt(cx,cy,r,hurtPlayer,ring){
  sfx('boom');vib(80);shake=.5;
  for(let y=cy-2;y<=cy+2;y++)for(let x=cx-2;x<=cx+2;x++){
    if(x<0||x>=COLS||y<SURF||y>=ROWS-1)continue;
    if(x===px&&y===py)continue;
    const dist=Math.max(Math.abs(x-cx),Math.abs(y-cy));
    if(dist<=r||(ring&&dist===2&&Math.random()<.5))removeTile(x,y);
  }
  burst(cx,cy,'#ff9800',22);
  if(hurtPlayer&&Math.abs(px-cx)<=r&&Math.abs(py-cy)<=r)hurt(1,'被爆炸波及');
}
function useTNT(){
  if(paused())return;

  save.tnt--;save.stat.tnt++;persist();explodeAt(px,py,1,false,true);ui();
}
function useLadder(){
  if(paused())return;
  if(save.lad<=0){say('沒有梯子,請到商店購買');return;}

// ---------- 掃描儀 ----------
function useScan(){
  if(paused())return;
  if(save.scan<=0){say('📡 還沒有掃描儀,到選單的「科技」購買');return;}
  if(scanCd>0){say('📡 冷卻中 '+Math.ceil(scanCd)+' 秒');return;}
  const R=SCAN_R[save.scan];
  const n={gold:0,gem:0,chest:0,barrel:0,coal:0};
  for(let y=py-R;y<=py+R;y++)for(let x=px-R;x<=px+R;x++){
    if(x<0||x>=COLS||y<SURF||y>=ROWS)continue;
    if((x-px)*(x-px)+(y-py)*(y-py)>R*R)continue;
    const t=grid[y][x];
    if(!HID[t])continue;
    reveal[y][x]=2;
    if(t===TY.GOLD)n.gold++;
    else if(t===TY.GEM||t===TY.DIAM)n.gem++;
    else if(t===TY.CHEST)n.chest++;
    else if(t===TY.BARREL)n.barrel++;
    else n.coal++;
  }
  scanCd=SCAN_CD[save.scan];scanFx={x:px,y:py,t:0,R};
  save.stat.scan++;persist();sfx('scan');vib(30);
  say('📡 金'+n.gold+' 寶石'+n.gem+' 寶箱'+n.chest+' ⚠️炸桶'+n.barrel);
}

// ---------- 自動挖礦機 ----------
function placeBot(){
  if(paused())return;
  if(save.bots<=0){say('🤖 還沒有挖礦機,到選單的「科技」購買');return;}
  if(bots.length>=save.bots){say('🤖 所有挖礦機都在工作中,去收回一台');return;}
  if(py<SURF-1||grid[py][px]===TY.BEDROCK)return;
  if(bots.some(b=>b.x===px&&b.y===py)){say('這裡已經有機器了');return;}
  bots.push({x:px,y:py,fuel:botFuelMax(),store:0,p:0,mt:0,armed:false});
  save.stat.bot++;persist();sfx('buy');vib(30);say('🤖 挖礦機開始往下挖!');ui();
}
function botMine(b,x,y){
  const t=grid[y][x];
  if(t===0||t===TY.BEDROCK||t===TY.LADDER)return;
  grid[y][x]=0;save.mined++;burst(x,y,INFO[t].col,4);
  const v=INFO[t].val;
  if(v>0)b.store+=v*(1+depthOf(y)/120);
  else if(t===TY.GEM)save.gems+=1;
  else if(t===TY.DIAM)save.gems+=3;
  else if(t===TY.CHEST)b.store+=Math.round(rnd(25,70)*(1+depthOf(y)/50));
}
function updateBots(dt){
  for(let i=bots.length-1;i>=0;i--){
    const b=bots[i];
    if(!(b.x===px&&b.y===py))b.armed=true;
    else if(b.armed){
      const g=Math.round(b.store*(1+0.1*save.sk.luck));
      save.gold+=g;save.earned+=g;save.stat.botc++;
      bots.splice(i,1);sfx('coin');vib(30);say('🤖 收回挖礦機 +'+g+' 💰');persist();ui();continue;
    }
    if(b.fuel<=0)continue;
    b.fuel-=dt;
    const ny=b.y+1;
    if(ny>=ROWS-1){b.fuel=0;continue;}
    const t=grid[ny][b.x];
    if(passable(t)){
      b.mt+=dt;
      if(b.mt>=.3){b.y++;b.mt=0;revealAround(b.x,b.y,1);}
      continue;
    }
    b.p+=dt;
    if(Math.random()<.08)burst(b.x,ny,INFO[t].col,2);
    if(b.p>=INFO[t].hard/botPow()){botMine(b,b.x,ny);b.p=0;b.y++;revealAround(b.x,b.y,1);}
  }
}

// ---------- 移動與挖掘 ----------
function airborne(){return py+1<ROWS&&grid[py+1][px]===0&&grid[py][px]!==TY.LADDER&&py>=SURF-1;}
function stepOrDig(dx,dy,dt){
  const nx=px+dx,ny=py+dy;
  if(nx<0||nx>=COLS||ny<SURF-1||ny>=ROWS)return;
  const t=grid[ny][nx];
  if(dx)face=dx;
  if(passable(t)){
    if(dy<0&&!(grid[py][px]===TY.LADDER||t===TY.LADDER))return;
    px=nx;py=ny;dig=null;stepT=.11;onArrive();return;
  }
  if(!dig||dig.x!==nx||dig.y!==ny)dig={x:nx,y:ny,p:0,need:INFO[t].hard/digPow()};
  dig.p+=dt;
  if(Math.random()<.2)sfx('dig');
  if(dig.p>=dig.need){
    const bt=t;removeTile(nx,ny);dig=null;
    if(bt===TY.BARREL)explodeAt(nx,ny,1,true,false);
    ui();
  }
}
function fallBoulders(){
  for(let y=ROWS-3;y>=SURF;y--)for(let x=0;x<COLS;x++){
    if(grid[y][x]!==TY.BOULDER)continue;
    if(x===px&&y+1===py){
      grid[y][x]=0;
      if(save.hat>0){save.hat--;save.stat.hat++;sfx('hurt');vib(80);say('⛑️ 安全帽擋下了落石!');burst(px,py,'#aaa',12);persist();ui();}
      else{burst(px,py,'#aaa',12);hp=0;die('被落石壓到');}
      return;
    }
    if(grid[y+1][x]===0){grid[y][x]=0;grid[y+1][x]=TY.BOULDER;}
  }
}
function update(dt){
  if(msgT>0){msgT-=dt;if(msgT<=0)$('msg').style.opacity=0;}
  for(const p of parts){p.life-=dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=380*dt;}
  parts=parts.filter(p=>p.life>0);
  if(shake>0)shake-=dt;
  if(scanFx){scanFx.t+=dt;if(scanFx.t>.9)scanFx=null;}
  if(paused())return;
  stepT-=dt;fallT-=dt;gravT-=dt;
  if(scanCd>0)scanCd=Math.max(0,scanCd-dt);
  const lbl=save.scan===0?'未購買':(scanCd>0?Math.ceil(scanCd)+'s':'OK');
  if(lbl!==lastScn){$('scn').textContent=lbl;lastScn=lbl;}
  updateBots(dt);
  if(gravT<=0){
    gravT=.08;
    if(airborne()){py++;fallDist++;dig=null;onArrive();}
    else if(fallDist>0){if(fallDist>=7)hurt(1,'摔傷了');fallDist=0;}
  }
  const air=airborne();
  let dx=0,dy=0;
  if(keys.left)dx=-1;else if(keys.right)dx=1;else if(keys.up)dy=-1;else if(keys.down)dy=1;
  if(!air&&(dx||dy)){
    const nx=px+dx,ny=py+dy;
    const t=(nx>=0&&nx<COLS&&ny>=0&&ny<ROWS)?grid[ny][nx]:-1;
    if(t>0&&!passable(t))stepOrDig(dx,dy,dt);
    else if(stepT<=0)stepOrDig(dx,dy,dt);
  }else if(!dx&&!dy)dig=null;
  if(fallT<=0){fallBoulders();fallT=.18;}
  lastAchT-=dt;if(lastAchT<=0){lastAchT=1;checkAch();}
}

// ---------- 繪圖 ----------
function drawTile(t,sx,sy){
  const base=[4,5,6,8,10,11].includes(t)?'#8b5a2b':INFO[t].col;
  ctx.fillStyle=base;ctx.fillRect(sx,sy,T,T);
  ctx.fillStyle='rgba(0,0,0,.12)';ctx.fillRect(sx,sy+T-4,T,4);
  if(t===4||t===5){ctx.fillStyle=INFO[t].col;for(const[a,b,s]of[[8,8,10],[22,14,9],[12,24,10]])ctx.fillRect(sx+a,sy+b,s,s-2);}
  if(t===6||t===8){ctx.fillStyle=INFO[t].col;for(const[a,b,s]of[[8,8,12],[21,16,11],[11,24,11]]){ctx.beginPath();ctx.moveTo(sx+a+s/2,sy+b);ctx.lineTo(sx+a+s,sy+b+s/2);ctx.lineTo(sx+a+s/2,sy+b+s);ctx.lineTo(sx+a,sy+b+s/2);ctx.fill();}}
  if(t===7){ctx.fillStyle='#8a8a92';ctx.beginPath();ctx.arc(sx+20,sy+20,17,0,7);ctx.fill();ctx.fillStyle='#6a6a72';ctx.beginPath();ctx.arc(sx+24,sy+23,6,0,7);ctx.fill();}
  if(t===2||t===3){ctx.strokeStyle='rgba(0,0,0,.3)';ctx.beginPath();ctx.moveTo(sx+6,sy+10);ctx.lineTo(sx+18,sy+20);ctx.moveTo(sx+24,sy+8);ctx.lineTo(sx+32,sy+30);ctx.stroke();}
  if(t===10){ctx.fillStyle='#c0392b';ctx.fillRect(sx+7,sy+6,26,28);ctx.fillStyle='#ffeb3b';ctx.fillRect(sx+7,sy+14,26,5);ctx.fillRect(sx+7,sy+25,26,4);ctx.fillStyle='#fff';ctx.font='bold 11px sans-serif';ctx.fillText('!',sx+18,sy+13);}
  if(t===11){ctx.fillStyle='#b8860b';ctx.fillRect(sx+5,sy+10,30,22);ctx.fillStyle='#ffd54a';ctx.fillRect(sx+5,sy+10,30,6);ctx.fillRect(sx+17,sy+17,6,8);}
}
function drawLadder(sx,sy){
  ctx.fillStyle='#2a1c12';ctx.fillRect(sx,sy,T,T);
  ctx.fillStyle='#c68642';ctx.fillRect(sx+9,sy,4,T);ctx.fillRect(sx+27,sy,4,T);
  for(let i=4;i<T;i+=10)ctx.fillRect(sx+9,sy+i,22,3);
}
function drawBot(b){
  const r=b.y-camY;
  if(r<-1||r>VH)return;
  const X=b.x*T,Y=r*T,on=b.fuel>0;
  ctx.fillStyle=on?'#ffb300':'#777';ctx.fillRect(X+8,Y+8,24,18);
  ctx.fillStyle=on?'#e65100':'#555';ctx.fillRect(X+8,Y+8,24,5);
  ctx.fillStyle='#212121';ctx.fillRect(X+8,Y+26,6,5);ctx.fillRect(X+26,Y+26,6,5);
  ctx.fillStyle='#cfd8dc';ctx.beginPath();ctx.moveTo(X+14,Y+26);ctx.lineTo(X+26,Y+26);ctx.lineTo(X+20,Y+38);ctx.fill();
  ctx.fillStyle='#00e5ff';ctx.fillRect(X+14,Y+14,5,5);ctx.fillRect(X+22,Y+14,5,5);
  ctx.fillStyle='rgba(0,0,0,.6)';ctx.fillRect(X+6,Y+1,28,5);
  ctx.fillStyle='#76ff03';ctx.fillRect(X+6,Y+1,28*Math.max(0,b.fuel)/botFuelMax(),5);
  if(b.fuel<=0&&b.store>0){ctx.font='14px sans-serif';ctx.fillText('💰',X+10,Y-2);}
}
function draw(){
  camY=Math.max(0,Math.min(ROWS-VH,py-Math.floor(VH/2)));
  ctx.save();
  if(shake>0)ctx.translate(rnd(-4,4),rnd(-4,4));
  ctx.fillStyle='#6ec6ff';ctx.fillRect(0,0,cv.width,cv.height);
  for(let r=0;r<VH;r++){
    const gy=camY+r;
    if(gy>=ROWS)break;
    for(let c=0;c<COLS;c++){
      const t=grid[gy][c],sx=c*T,sy=r*T;
      if(gy<SURF){
        if(gy===SURF-1){ctx.fillStyle='#4caf50';ctx.fillRect(sx,sy+T-8,T,8);}
        continue;
      }
      if(t===0){ctx.fillStyle='#2a1c12';ctx.fillRect(sx,sy,T,T);
        if(isCP(gy,c)){ctx.fillStyle='#3a2a1c';ctx.fillRect(sx,sy,T,T);}}
      else if(t===9)drawLadder(sx,sy);
      else{
        const rv=reveal[gy][c];
        drawTile(HID[t]&&!rv?1:t,sx,sy);
        if(HID[t]&&rv===2){
          ctx.strokeStyle='rgba(255,235,59,'+(.55+.45*Math.sin(tNow/180))+')';
          ctx.lineWidth=3;ctx.strokeRect(sx+2,sy+2,T-4,T-4);ctx.lineWidth=1;
        }
      }
    }
  }
  const sr=SURF-1-camY;
  if(sr>=-1){
    ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(120,40-camY*T,22,0,7);ctx.arc(150,45-camY*T,28,0,7);ctx.arc(185,40-camY*T,20,0,7);ctx.fill();
    ctx.beginPath();ctx.arc(420,70-camY*T,18,0,7);ctx.arc(445,74-camY*T,24,0,7);ctx.arc(472,70-camY*T,16,0,7);ctx.fill();
    ctx.fillStyle='#c0392b';ctx.fillRect(T,sr*T-T+8,T*2,T*2-16);
    ctx.fillStyle='#fff';ctx.font='bold 14px sans-serif';ctx.fillText('SELL',T+16,sr*T+10);
  }
  for(let k=1;SURF+CPGAP*k<ROWS-2;k++){
    const rr=SURF+CPGAP*k-camY;
    if(rr>=0&&rr<VH){ctx.fillStyle='#fff';ctx.fillRect(7*T+18,rr*T+4,3,32);ctx.fillStyle=(SURF+CPGAP*k<=save.cp)?'#4caf50':'#ff7043';ctx.fillRect(7*T+21,rr*T+5,16,11);}
  }
  for(const b of bots)drawBot(b);
  const X=px*T,Y=(py-camY)*T;
  ctx.fillStyle='#1565c0';ctx.fillRect(X+10,Y+22,20,14);
  ctx.fillStyle='#ffcc80';ctx.fillRect(X+10,Y+8,20,14);
  ctx.fillStyle='#f9a825';ctx.fillRect(X+8,Y+3,24,8);
  ctx.fillStyle='#000';ctx.fillRect(X+(face>0?23:14),Y+13,3,3);
  ctx.fillStyle='#8b5a2b';ctx.fillRect(X+(face>0?30:4),Y+20,6,3);
  if(save.hat>0){ctx.fillStyle='#ffeb3b';ctx.fillRect(X+8,Y,24,5);}
  if(dig){const dxx=dig.x*T,dyy=(dig.y-camY)*T;ctx.fillStyle='rgba(0,0,0,.55)';ctx.fillRect(dxx+4,dyy+T-10,T-8,6);ctx.fillStyle='#ffeb3b';ctx.fillRect(dxx+4,dyy+T-10,(T-8)*Math.min(1,dig.p/dig.need),6);}
  for(const p of parts){ctx.globalAlpha=Math.max(0,p.life*2);ctx.fillStyle=p.col;ctx.fillRect(p.x,p.y-camY*T,5,5);}
  ctx.globalAlpha=1;
  if(scanFx){
    const k=scanFx.t/.9;
    ctx.strokeStyle='rgba(0,229,255,'+(1-k)+')';ctx.lineWidth=4;
    ctx.beginPath();ctx.arc(scanFx.x*T+20,(scanFx.y-camY)*T+20,k*scanFx.R*T,0,7);ctx.stroke();ctx.lineWidth=1;
  }
  const dep=Math.min(1,depthOf(py)/200)*0.6;
  ctx.fillStyle='rgba(0,0,10,'+dep+')';ctx.fillRect(0,0,cv.width,cv.height);
  ctx.restore();
  ctx.fillStyle='rgba(0,0,0,.4)';ctx.fillRect(cv.width-10,10,6,cv.height-20);
  ctx.fillStyle='#ffd54a';ctx.fillRect(cv.width-10,10+(cv.height-20)*(py/ROWS),6,10);
  ctx.fillStyle='#00e5ff';
  for(const b of bots)ctx.fillRect(cv.width-12,10+(cv.height-20)*(b.y/ROWS),10,4);
}

    <div class="item"><span>⛏️ ${PICK_NAME[save.pick-1]} Lv.${save.pick}<br><small>${maxP?'已滿級':'升級為 '+PICK_NAME[save.pick]+',挖更快'}</small></span><button class="btn gold" ${maxP?'disabled':''} onclick="buy('pick',${pc})">${maxP?'MAX':pc+'💰'}</button></div>
    <div class="item"><span>🎒 背包 ${save.cap} 格<br><small>+10 格(上限 120)</small></span><button class="btn gold" ${save.cap>=120?'disabled':''} onclick="buy('cap',${cc})">${cc}💰</button></div>
    <div class="item"><span>💣 TNT x1(持有 ${save.tnt})<br><small>炸開周圍方塊,自己不受傷</small></span><button class="btn gold" onclick="buy('tnt',25)">25💰</button></div>
    <div class="item"><span>💣 TNT 組合 x5<br><small>比單買便宜</small></span><button class="btn gold" onclick="buy('tnt5',100)">100💰</button></div>
    <div class="item"><span>🪜 梯子 x10(持有 ${save.lad})<br><small>讓你爬回地面</small></span><button class="btn gold" onclick="buy('lad',40)">40💰</button></div>
    <div class="item"><span>⛑️ 安全帽(持有 ${save.hat}/3)<br><small>擋下一次落石</small></span><button class="btn gold" ${save.hat>=3?'disabled':''} onclick="buy('hat',80)">80💰</button></div>`;
  }
  if(tab==='tech'){
    const sl=save.scan,sMax=sl>=4;
    const bm=save.bots>=4,um=save.botLv>=5;
    C.innerHTML=head+`
    <div class="item"><span>📡 掃描儀 Lv.${sl}/4<br><small>${sl?'半徑 '+SCAN_R[sl]+' 格,冷卻 '+SCAN_CD[sl]+' 秒':'尚未購買'}${sMax?'':' → 下一級:半徑 '+SCAN_R[sl+1]+',冷卻 '+SCAN_CD[sl+1]+' 秒'}</small></span><button class="btn gold" ${sMax?'disabled':''} onclick="buy('scan',${SCAN_COST[sl]||0})">${sMax?'MAX':SCAN_COST[sl]+'💰'}</button></div>
    <div class="item"><span>🤖 挖礦機數量 ${save.bots}/4<br><small>每台可獨立往下挖,挖到的礦存在機器裡</small></span><button class="btn gold" ${bm?'disabled':''} onclick="buy('bot',${BOT_COST[save.bots]||0})">${bm?'MAX':BOT_COST[save.bots]+'💰'}</button></div>
    <div class="item"><span>⚙️ 挖礦機升級 Lv.${save.botLv}/5<br><small>挖掘力 ${botPow().toFixed(1)}、工作 ${botFuelMax()} 秒${um?'':' → 下一級:挖掘力 '+(0.8+0.5*(save.botLv+1)).toFixed(1)+'、'+(60+30*(save.botLv+1))+' 秒'}</small></span><button class="btn gold" ${um?'disabled':''} onclick="buy('botup',${BOT_UP[save.botLv+1]||0})">${um?'MAX':BOT_UP[save.botLv+1]+'💰'}</button></div>
    <p style="font-size:13px;color:#b9b3d9;line-height:1.7">📡 點「掃描」,附近藏起來的礦物會閃黃框。<br>🤖 點「機器」在腳下放挖礦機,它會一路往下挖;走回它身上就能收回並領錢。</p>`;
  }
  if(tab==='skill'){
    const S=[['speed','⚡ 快手','挖掘速度 +12% / 級'],['luck','🍀 幸運','賣出價格 +10% / 級'],['bag','🧳 大袋子','背包 +5 格 / 級']];
    C.innerHTML=head+S.map(([k,n,d])=>{const lv=save.sk[k],cost=lv+1;
      return `<div class="item"><span>${n} Lv.${lv}/5<br><small>${d}</small></span><button class="btn gold" ${lv>=5?'disabled':''} onclick="upSkill('${k}')">${lv>=5?'MAX':cost+'⭐'}</button></div>`}).join('')
      +`<p style="font-size:13px;color:#b9b3d9">每挖到新的 20m 深度或完成成就,可獲得 1 個技能點。</p>`;
  }
  if(tab==='quest'){
    C.innerHTML=head+QUEST.map(q=>{const v=Math.min(q.g(),q.goal),done=save.claim[q.id],can=v>=q.goal&&!done;
      return `<div class="item ${done?'done':''}"><span style="flex:1">${q.n}<br><small>${v}/${q.goal} ・獎勵 ${q.gems}💎</small><div class="bar"><i style="width:${v/q.goal*100}%"></i></div></span><button class="btn green" ${can?'':'disabled'} onclick="claim('${q.id}')">${done?'已領':'領取'}</button></div>`}).join('');
  }
  if(tab==='ach'){
    C.innerHTML=head+ACH.map(a=>`<div class="item ${save.ach[a.id]?'':'done'}"><span>${save.ach[a.id]?'🏆':'🔒'} ${a.n}<br><small>${a.d}</small></span><span>${save.ach[a.id]?'+1⭐':''}</span></div>`).join('');
  }
  if(tab==='lb'){
    const rows=save.lb.map((r,i)=>`<tr><td>${i+1}</td><td>${r.name}</td><td>${r.depth}m</td><td>${r.t}</td></tr>`).join('')||'<tr><td colspan=4>還沒有紀錄,去挖深一點吧!</td></tr>';
    C.innerHTML=head+`<table><tr><th>#</th><th>名字</th><th>深度</th><th>日期</th></tr>${rows}</table><p style="font-size:13px;color:#b9b3d9">本機排行榜(存在這台裝置)。最深紀錄:${save.best}m</p>`;
  }
  if(tab==='help'){
    C.innerHTML=`<div style="font-size:14px;line-height:1.85">
    <b>手機操作</b><br>• 左下搖桿:移動與挖掘(朝方塊推著不放就會挖)<br>• 右下按鈕:TNT、梯子、掃描、挖礦機、存檔點、回地面<br>• 右上 ☰:商店、科技、技能、任務<br><br>
    <b>電腦鍵盤</b><br>方向鍵 / WASD 移動 ・ E:TNT ・ L:梯子 ・ Q:掃描 ・ B:挖礦機 ・ R:回地面 ・ C:存檔點 ・ M:選單<br><br>
    <b>玩法</b><br>• 礦物、寶箱、爆炸桶藏在泥土裡,靠近一格或用 📡 掃描才看得到<br>• 回到地面會自動賣掉礦物,越深越值錢<br>• 🤖 挖礦機自己往下挖,走回去收回就能領錢<br>• 往上爬需要在原地放梯子<br>• 摔太高(7 格以上)、被爆炸桶炸到會扣血<br>• 🪨落石砸中會死亡,安全帽可擋一次<br>• 每 50m 有存檔點,可補滿血並記錄<br>• 死亡可花 3 寶石原地復活</div>`;
  }
  if(tab==='set'){
    C.innerHTML=`<div class="item"><span>🔊 音效</span><button class="btn" onclick="save.snd=!save.snd;persist();render()">${save.snd?'開':'關'}</button></div>
    <div class="item"><span>📳 震動回饋</span><button class="btn" onclick="save.vib=!save.vib;persist();render();vib(40)">${save.vib?'開':'關'}</button></div>
    <div class="item" style="display:block"><div style="margin-bottom:6px">👤 礦工名字</div><input type="text" id="nm" maxlength="10" value="${save.name}" onchange="save.name=this.value||'礦工';persist()"></div>
    <button class="btn red" style="width:100%;margin-top:8px" onclick="if(confirm('確定清除所有進度?')){localStorage.removeItem('goldMinerV2');location.reload();}">🗑️ 清除所有進度</button>`;
  }
}
function buy(k,cost){
  if(save.gold<cost){say('金幣不夠!');vib(60);return;}
  save.gold-=cost;
  if(k==='pick')save.pick++;
  if(k==='cap')save.cap+=10;
  if(k==='tnt')save.tnt++;
  if(k==='tnt5')save.tnt+=5;
  if(k==='lad')save.lad+=10;
  if(k==='hat')save.hat++;
  if(k==='scan')save.scan++;
  if(k==='bot')save.bots++;
  if(k==='botup')save.botLv++;
  sfx('buy');vib(25);persist();ui();render();
}
function upSkill(k){
  const lv=save.sk[k];if(lv>=5)return;
  if(save.stars<lv+1){say('技能點不夠');return;}
  save.stars-=lv+1;save.sk[k]++;sfx('buy');vib(25);persist();ui();render();
}
function claim(id){
  const q=QUEST.find(x=>x.id===id);
  if(!q||save.claim[id]||q.g()<q.goal)return;
  save.claim[id]=1;save.gems+=q.gems;sfx('ach');vib(40);persist();ui();render();
}

// ---------- 按鈕 ----------
function bind(id,fn){$(id).addEventListener('pointerdown',e=>{e.preventDefault();fn();});}
function toSurface(){
  if(paused())return;
  if(cargo>0){const v=Math.floor(sellValue*0.8);save.gold+=v;save.earned+=v;say('緊急回地面,賣得 '+v);}
  recordRun();cargo=0;sellValue=0;px=7;py=SURF-1;dig=null;fallDist=0;hp=3;persist();ui();
}
function toCP(){
  if(paused())return;
  if(!save.cp){say('還沒有存檔點,挖到 50m 就有了');return;}
  recordRun();px=7;py=save.cp;dig=null;fallDist=0;hp=3;revealAround(px,py,1);ui();say('⛺ 已傳送到存檔點');
}
bind('tntBtn',useTNT);bind('ladBtn',useLadder);bind('scanBtn',useScan);bind('botBtn',placeBot);
bind('upBtn',toSurface);bind('cpBtn',toCP);
$('menuBtn').addEventListener('click',()=>openPanel());
$('startBtn').onclick=()=>{homeOpen=false;$('home').style.display='none';fit();say('往下挖!回到地面可賣礦');};
$('homeShop').onclick=()=>openPanel('shop');
$('fsBtn').onclick=()=>{const d=document.documentElement;(d.requestFullscreen||d.webkitRequestFullscreen||(()=>{})).call(d);};
$('reviveBtn').onclick=()=>{if(save.gems<3)return;save.gems-=3;persist();hp=3;dead=false;$('death').style.display='none';
  for(let y=py-1;y<=py+1;y++)for(let x=px-1;x<=px+1;x++)if(y>=SURF&&x>=0&&x<COLS&&grid[y][x]===TY.BOULDER)grid[y][x]=0;
  ui();say('💎 已復活!');};
$('respBtn').onclick=()=>{respawn(save.cp||SURF-1);};

// ---------- 搖桿 ----------
const pad=$('pad');let padId=null;
function setDir(d){pad.dataset.dir=d;}
function padSet(e){
  const r=pad.getBoundingClientRect();
  const x=e.clientX-(r.left+r.width/2),y=e.clientY-(r.top+r.height/2);
  keys.left=keys.right=keys.up=keys.down=false;
  if(Math.hypot(x,y)<r.width*.12){setDir('');return;}
  let d;
  if(Math.abs(x)>Math.abs(y)){d=x<0?'left':'right';}else{d=y<0?'up':'down';}
  keys[d]=true;setDir(d);
}
pad.addEventListener('pointerdown',e=>{e.preventDefault();padId=e.pointerId;try{pad.setPointerCapture(e.pointerId)}catch(_){}padSet(e);});
pad.addEventListener('pointermove',e=>{if(e.pointerId===padId)padSet(e);});
const padEnd=e=>{if(e.pointerId===padId){padId=null;keys.left=keys.right=keys.up=keys.down=false;setDir('');}};
pad.addEventListener('pointerup',padEnd);pad.addEventListener('pointercancel',padEnd);

// ---------- 鍵盤 ----------
const KM={ArrowLeft:'left',ArrowRight:'right',ArrowUp:'up',ArrowDown:'down',a:'left',d:'right',w:'up',s:'down',A:'left',D:'right',W:'up',S:'down'};
addEventListener('keydown',e=>{
  if(e.target.tagName==='INPUT')return;
  if(e.key==='Escape'){closePanel();return;}
  if(KM[e.key]){keys[KM[e.key]]=true;setDir(KM[e.key]);e.preventDefault();}
  const k=e.key.toLowerCase();
  if(k==='e')useTNT();
  if(k==='l')useLadder();
  if(k==='q')useScan();
  if(k==='b')placeBot();
  if(k==='r')toSurface();
  if(k==='c')toCP();
  if(k==='m'&&!homeOpen)(panelOpen?closePanel():openPanel());
});
addEventListener('keyup',e=>{if(KM[e.key]){keys[KM[e.key]]=false;setDir('');}});
addEventListener('blur',()=>{keys={};setDir('');});

// ---------- 手機行為 ----------
document.addEventListener('visibilitychange',()=>{bgPause=document.hidden;if(document.hidden){keys={};setDir('');}});
document.addEventListener('contextmenu',e=>e.preventDefault());
document.addEventListener('gesturestart',e=>e.preventDefault());
let lastTap=0;
document.addEventListener('touchend',e=>{const n=Date.now();if(n-lastTap<300)e.preventDefault();lastTap=n;},{passive:false});

genWorld();px=7;py=SURF-1;revealAround(px,py,1);ui();fit();
requestAnimationFrame(loop);
</script>
</body>
</html>
